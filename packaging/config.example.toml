# Dispatch configuration. Every value here is a default -- an empty file, or no file at
# all, works. Copy to ~/.config/dispatch/config.toml and change what you care about.
#
# Unknown keys are a startup error rather than being ignored, so a typo cannot silently
# leave the machine scheduling differently from what this file says.

[scheduler]
# "backfill" lets small jobs use idle cores while a large job waits, but only for a
# bounded number of passes so the large job cannot be starved. "fifo" is strict order.
# "shortest-first" packs the machine hardest and makes queue order least predictable.
policy = "backfill"

# Cores held back from jobs so the machine stays usable over SSH. The alternative is a
# box you cannot log in to in order to cancel the job making it unresponsive.
reserved_cores = 1

# Override the detected core count. Leave unset to use all of them.
# total_cores = 24

# Override the detected GPU count. Dispatch counts NVIDIA devices under
# /proc/driver/nvidia/gpus and AMD compute devices under /sys/class/kfd; set this if it
# guesses wrong, or to 0 on a machine whose GPUs belong to something else -- GPU jobs are
# then refused at submission with a reason rather than queueing forever.
# `dispatch doctor` prints what it detected.
#
# Unlike cores, none are held back: nothing about logging in over SSH needs a GPU.
# total_gpus = 2

# RAM kept free above the sum of running jobs' declared estimates.
ram_margin_mb = 2048

# Admission stops below this much free space where logs are written.
min_free_disk_mb = 1024

[daemon]
# Start a daemon automatically when `dispatch` finds none running.
autostart = true

# Seconds between rungs of the SIGINT -> SIGTERM -> SIGKILL cancellation ladder.
cancel_grace_s = 10.0

# Whether stopping the daemon also stops running simulations. Changing this should feel
# like a decision.
shutdown_kills_jobs = false

[projects]
# Where `dispatch find` and the new-job screen's `/` search look. One directory, never the
# whole filesystem -- Dispatch does not guess where your work lives.
root = "~/projects"

# Bounds on the walk. It runs on a keystroke rather than from an index, so it has to stay
# fast; when a limit stops it, the results say so rather than looking complete.
max_depth = 6
max_entries = 20000
limit = 50

[plot]
# Reading a job's log for `p`. A very long log is read from its end -- the recent part is
# the one worth having -- and the interface says when that happened.
max_log_bytes = 33554432

# Points per series after downsampling. Bounds the IPC message and the render; both ends
# of every series are always kept.
max_points = 2000

[notifications]
on = ["job.completed", "job.failed"]
sinks = ["log"]

# The `command` sink runs anything, with the notification in its environment as
# DISPATCH_EVENT, DISPATCH_TITLE, DISPATCH_BODY, and DISPATCH_JOB_ID. This is how ntfy,
# Discord, or email are wired up without Dispatch growing an HTTP client.
# [notifications.command]
# argv = ["curl", "-d", "$DISPATCH_BODY", "https://ntfy.sh/eddy-dispatch"]

[adapters.openfoam]
# Where to source OpenFOAM from. Probed automatically if unset; set it if your install is
# somewhere unusual, or if `dispatch doctor` reports the solver as missing.
# bashrc = "/usr/lib/openfoam/openfoam2406/etc/bashrc"

# Method used when Dispatch has to write a decomposeParDict from scratch. An existing one
# is edited in place, preserving whatever method you chose.
decomposition_method = "scotch"

[adapters.basilisk]
# qcc = "qcc"
# flags = ["-O2", "-Wall"]
# libs = ["-lm"]

[adapters.calculix]
# binary = "ccx"

# The ML and PINN adapters take their per-project settings from a `dispatch.toml` in the
# project directory rather than from here, since entrypoints and virtual environments are
# properties of a project rather than of the machine:
#
#     # ~/projects/pinn_burgers/dispatch.toml
#     [job]
#     adapter    = "pinn"
#     entrypoint = "train_burgers.py"
#     args       = ["--config", "configs/burgers.yaml"]
#     venv       = ".venv"
#
# What belongs here is the machine-wide fallback interpreter, used when a project ships no
# virtual environment and names no python of its own.
# [adapters.ml]
# python = "python3.13"
#
# [adapters.pinn]
# python = "python3.13"

